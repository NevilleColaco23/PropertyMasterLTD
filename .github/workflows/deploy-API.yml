# ==============================================================================
# Builds and deploys the backend .NET Web API to Azure App Service.
#
# The App Service itself and ALL of its app settings (MongoDB, JWT key, Resend key,
# CORS origin, ...) are created by Terraform (see /terraform). This workflow only
# builds the code and deploys the package.
#
# One-time setup in GitHub (Settings -> Secrets and variables -> Actions):
#   Variable  AZURE_WEBAPP_NAME             = terraform output -raw api_app_name
#   Secret    AZURE_WEBAPP_PUBLISH_PROFILE  = az webapp deployment list-publishing-profiles \
#                                               --name <app name> --resource-group rg-propertymaster --xml
#
# Triggers only on pushes to 'Azure_web_App_Deployment' (production) or manually.
# ==============================================================================

name: Build and deploy ASP.Net Core app to Azure Web App

on:
  push:
    branches:
      - Azure_web_App_Deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Build with dotnet
        run: dotnet build ./WebApi/WebApi.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./WebApi/WebApi.csproj -c Release -f net6.0 -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
