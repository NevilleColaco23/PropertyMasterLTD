name: Build & Push Docker Images to ghcr.io

# Triggers on every push to the deployment branch
on:
  push:
    branches:
      - Azure_web_App_Deployment
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase - GitHub username
  IMAGE_OWNER: nevillecolaco23

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build & Push EmailWorker
  # ──────────────────────────────────────────────
  build-emailworker:
    name: 📧 EmailWorker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/propertymaster-emailworker
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push EmailWorker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: EmailWorker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # JOB 2: Deploy EmailWorker → Azure Container Apps
  # ──────────────────────────────────────────────
  deploy-emailworker:
    name: 🚀 Deploy EmailWorker → Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-emailworker
    environment: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Deploy EmailWorker to Azure Container Apps
        run: |
          az containerapp update \
            --name propertymaster-emailworker \
            --resource-group rg-propertymaster-dev \
            --image ghcr.io/${{ env.IMAGE_OWNER }}/propertymaster-emailworker:latest \
            --set-env-vars \
              "ConnectionStrings__MongoDb=${{ secrets.MONGODB_CONNECTION_STRING }}" \
              "ServiceBus__ConnectionString=${{ secrets.AZURE_SERVICE_BUS_CONNECTION_STRING }}" \
              "ServiceBus__EmailQueueName=email-queue" \
              "Resend__ApiKey=${{ secrets.RESEND_API_KEY }}" \
              "Email__From=${{ secrets.EMAIL_FROM }}" \
              "AppSettings__MongoDbDatabaseName=ListingDB" \
              "ASPNETCORE_ENVIRONMENT=Production"
