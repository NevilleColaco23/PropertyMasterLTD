services:
  api:
    build:
      context: ..
      dockerfile: testAngularAPI.Server/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ListingDB

  mongo:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
