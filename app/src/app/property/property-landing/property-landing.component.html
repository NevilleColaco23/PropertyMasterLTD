<header class="main-header">
  <div class="logo">
    @if (logoPath) {
      <img [src]="logoPath" alt="Company Logo" class="canva-logo">
    }
  </div>

  <nav class="navigation-links" aria-label="Primary navigation">
    @for (item of navItems; track item.label) {
      <div class="nav-item-wrapper">
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item"
        >
          {{ item.label }}
          @if (item.hasDropdown && item.subItems?.length) {
            <span class="arrow-down" aria-hidden="true"></span>
          }
        </a>

        @if (item.hasDropdown && item.subItems?.length) {
          <div class="mega-menu-panel">
            <div class="mega-menu-content">
              <div class="mega-menu-column">
                <ul>
                  @for (sub of item.subItems; track sub.subLabel) {
                    <li>
                      <a [routerLink]="sub.subPath">{{ sub.subLabel }}</a>
                    </li>
                  }
                </ul>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </nav>

  <div class="header-actions">
    <app-search-box-autocomplete (searchSelected)="onSearchSelected($event)">
    </app-search-box-autocomplete>

    <div class="header-buttons">
      <button mat-button class="header-btn" type="button" (click)="goToProfile()">
        My Profile
      </button>

      <button mat-button class="header-btn header-btn--danger" type="button" (click)="signOut()">
        Sign Out
      </button>
    </div>
  </div>
</header>

<app-system-messages-snackbar></app-system-messages-snackbar>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
