<header class="main-header">
  <div class="logo">
    <img src="your-canva-logo-path.png" alt="Canva Logo" class="canva-logo">
  </div>

  <nav class="navigation-links">
  <div class="nav-item-wrapper" *ngFor="let item of navItems">
    <a href="{{ item.path || '#' }}" class="nav-item">
      {{ item.label }}
      <span *ngIf="item.hasDropdown" class="arrow-down"></span>
    </a>

    <div class="mega-menu-panel" *ngIf="item.hasDropdown && item.subItems?.length">
      <div class="mega-menu-content">
        <div class="mega-menu-column" *ngFor="let sub of item.subItems">
          <h3>{{ sub.subLabel }}</h3>
          <ul>
            <li><a [routerLink]="sub.subPath">{{ sub.subLabel }}</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>


  <div class="search-container-autocomplete">
    <input type="text" id="searchInput" placeholder="Search..."
           [(ngModel)]="searchQuery"
           (input)="onSearchInput()"
           (keydown)="onKeyDown($event)"
           (focus)="onSearchFocus()"
           class="header-search-input">
    <span class="search-icon">🔍</span>
    <div id="suggestions" class="suggestions-list"
         [class.show-suggestions]="showSuggestionsList">
      <div *ngFor="let suggestion of filteredSuggestions; let i = index"
           [class.active]="i === activeSuggestionIndex"
           (click)="selectSuggestion(suggestion)">
        <span class="search-icon-small" *ngIf="!suggestion.startsWith('Search for ')">🔍</span>
        <span class="gallery-icon-small" *ngIf="suggestion.includes('Doc') || suggestion.includes('Document')">🖼️</span>
        {{ suggestion }}
        <span class="close-icon-small" *ngIf="i === activeSuggestionIndex">✖</span>
      </div>
    </div>
  </div>
  <div class="example-button-row">
      <button mat-button="filled" (click)="signOut()">Sign Out</button>
  </div>
  </header>
