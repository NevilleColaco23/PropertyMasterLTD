<header class="main-header">
  <div class="logo">
    @if (logoPath) {
      <img [src]="logoPath" alt="Canva Logo" class="canva-logo">
    }
  </div>

  <nav class="navigation-links">
    <!-- Modern @for loop replaces *ngFor -->
    @for (item of navItems; track item.label) {
      <div class="nav-item-wrapper">
        <a [routerLink]="item.path" class="nav-item">
          {{ item.label }}
          @if (item.hasDropdown && item.subItems?.length) {
            <span class="arrow-down"></span>
          }
        </a>

        @if (item.hasDropdown && item.subItems?.length) {
          <div class="mega-menu-panel">
            <div class="mega-menu-content">
              <div class="mega-menu-column">
                <ul>
                  <!-- Modern @for for sub-items -->
                  @for (sub of item.subItems; track sub.subLabel) {
                    <li>
                      <a [routerLink]="sub.subPath">{{ sub.subLabel }}</a>
                    </li>
                  }
                </ul>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </nav>

  <app-search-box-autocomplete
    (searchSelected)="onSearchSelected($event)">
  </app-search-box-autocomplete>

  <div class="example-button-row">
    <!-- Using the 2026 MatButton updated syntax -->
    <button mat-flat-button (click)="signOut()">Sign Out</button>
  </div>
</header>

<app-system-messages-snackbar></app-system-messages-snackbar>

<main>
  <router-outlet></router-outlet>
</main>
