<header class="site-header">
  <!-- Top blue bar: LOGO + search + profile/signout + email/cta -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-logo">
        @if (logoPath) {
          <img [src]="logoPath" alt="Company Logo" class="topbar-logo-img">
        }
      </div>

      <div class="topbar-right">
        <div class="topbar-search">
          <app-search-box-autocomplete (searchSelected)="onSearchSelected($event)">
          </app-search-box-autocomplete>
        </div>

        <div class="topbar-user">
          <button mat-button class="topbar-btn" type="button" (click)="goToProfile()">
            My Profile
          </button>

          <button mat-button class="topbar-btn topbar-btn--danger" type="button" (click)="signOut()">
            Sign Out
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- White bar: NAV only -->
  <div class="mainbar">
    <div class="mainbar-inner">
      <nav class="nav" aria-label="Primary navigation">
        @for (item of navItems; track item.label) {
          <div class="nav-item-wrapper">
            <a
              [routerLink]="item.path"
              routerLinkActive="nav-link--active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              {{ item.label }}
              @if (item.hasDropdown && item.subItems?.length) {
                <span class="arrow-down" aria-hidden="true"></span>
              }
            </a>

            @if (item.hasDropdown && item.subItems?.length) {
              <div class="mega-menu-panel">
                <div class="mega-menu-content">
                  <div class="mega-menu-column">
                    <ul>
                      @for (sub of item.subItems; track sub.subLabel) {
                        <li>
                          <a [routerLink]="sub.subPath">{{ sub.subLabel }}</a>
                        </li>
                      }
                    </ul>
                  </div>
                </div>
              </div>
            }
          </div>
        }
      </nav>
    </div>
  </div>
</header>

<app-system-messages-snackbar></app-system-messages-snackbar>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
