<div class="d-flex justify-content-between mb-3" style="margin-left: -30px;"> <!-- Move container to the left -->
  <div class="btn-group" role="group" aria-label="Navigation buttons">
    <button type="button" class="btn btn-primary" (click)="previous()">Previous</button>
    <button type="button" class="btn btn-light" (click)="today()">Today</button>
    <button type="button" class="btn btn-primary" (click)="next()">Next</button>
  </div>
  <div class="btn-group" role="group" aria-label="Calendar view selection" *ngIf="!toggleViewEnabled">
    <button type="button" class="btn btn-outline-primary" [ngClass]="{ 'active': view === CalendarView.Month }" (click)="setView(CalendarView.Month)">Month</button>
    <button type="button" class="btn btn-outline-primary" [ngClass]="{ 'active': view === CalendarView.Week }" (click)="setView(CalendarView.Week)">Week</button>
    <button type="button" class="btn btn-outline-primary" [ngClass]="{ 'active': view === CalendarView.Day }" (click)="setView(CalendarView.Day)">Day</button>
  </div>
  <button type="button" class="btn btn-secondary ml-3" (click)="toggleView()">{{ toggleViewEnabled ? 'Show Calendar View' : 'Show Gantt Chart View' }}</button>
</div>

  
  <div class="text-center mb-3">
    <h2>{{ title }}</h2>
  </div>
  
  <div class="calendar-container" *ngIf="!toggleViewEnabled">
    <ng-container *ngIf="view === CalendarView.Month">
      <mwl-calendar-month-view [viewDate]="viewDate"
                               [events]="events"
                               [activeDayIsOpen]="activeDayIsOpen"
                               (dayClicked)="handleDayClick($event.day)">
      </mwl-calendar-month-view>
    </ng-container>
    <ng-container *ngIf="view === CalendarView.Week">
      <mwl-calendar-week-view [viewDate]="viewDate"
                              [events]="events"
                              [activeDayIsOpen]="activeDayIsOpen">
      </mwl-calendar-week-view>
    </ng-container>
    <ng-container *ngIf="view === CalendarView.Day">
      <mwl-calendar-day-view [viewDate]="viewDate"
                             [events]="events"
                             [activeDayIsOpen]="activeDayIsOpen">
      </mwl-calendar-day-view>
    </ng-container>
  </div>
  
  
  <div class="gantt-chart-container" *ngIf="toggleViewEnabled">
    <div class="header">
      <div class="room-header-sticky">Rooms</div> <!-- Placeholder for room names column -->
      <div class="dates-header">
        <div class="cell" *ngFor="let date of dates">
          <button type="button" class="btn btn-outline-secondary">{{ date | date: 'dd MMM' }}</button>
        </div>
      </div>
    </div>
    <div class="content-wrapper">
      <div class="room-names-sticky">
        <div class="room-name" *ngFor="let room of rooms">{{ room.name }}</div>
      </div>
      <div class="gantt-content">
        <div class="room-rows">
          <div class="room-row" *ngFor="let room of rooms">
            <div class="booking-container">
              <ng-container *ngFor="let booking of room.bookings">
                <button type="button" class="booking-period btn"
                        [ngStyle]="{'left': calculateLeft(booking.start), 'width': calculateWidth(booking.start, booking.end), 'background-color': calculateOverlapColor(booking.start, booking.end, room.bookings)}">
                  <span class="booking-title">{{ booking.title }}</span>
                </button>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
      </div>
  </div>
