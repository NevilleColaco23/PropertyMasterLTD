<mat-card class="user-form-card">
  <h2>Create User</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter name">
      <mat-error *ngIf="userForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="Enter email">
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">
        Enter a valid email
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Phone Number</mat-label>
      <input matInput type="tel" formControlName="phone" placeholder="Enter phone number">
      <mat-error *ngIf="userForm.get('phone')?.hasError('required')">
        Phone number is required
      </mat-error>
      <mat-error *ngIf="userForm.get('phone')?.hasError('pattern')">
        Phone number must be 8–15 digits
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" placeholder="Enter password">
      <mat-error *ngIf="userForm.get('password')?.hasError('required')">
        Password is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" placeholder="Re-enter password">
      <mat-error *ngIf="userForm.get('confirmPassword')?.hasError('required')">
        Confirm Password is required
      </mat-error>
    </mat-form-field>

    <!-- Show if passwords don't match -->
    <div *ngIf="passwordMismatch" style="color: red; margin-bottom: 12px;">
      Passwords do not match
    </div>

    <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
      Create User
    </button>

  </form>
</mat-card>
