<mat-card class="login-card">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" required autocomplete="email" />
      <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        Please enter a valid email address
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required autocomplete="current-password" />
      <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password visibility'" type="button">
        <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Password is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
      Login
    </button>
<span *ngIf="localLoginState == localLoginStates.Waiting" class="ml-3">Please wait... <fa-icon [icon]="faSpinner"
                  [spin]="true"></fa-icon></span>
              <span *ngIf="localLoginState == localLoginStates.ErrorWrongData" class="ml-3 text-danger">Incorrect credentials.</span>
              <span *ngIf="localLoginState == localLoginStates.Success" class="ml-3 text-success">Success.</span>
  
  </form>
</mat-card>
