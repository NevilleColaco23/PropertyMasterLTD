<mat-card class="activity-feed-widget">
  <mat-card-header>
    <mat-card-title>
      <div class="header-content">
        <mat-icon class="widget-icon">feed</mat-icon>
        <span>{{ title }}</span>
      </div>
      <div class="header-actions" *ngIf="showRefreshButton">
        <button mat-icon-button (click)="refresh()" matTooltip="Refresh" [disabled]="loading">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading activity feed...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-container">
      <mat-icon color="warn">error_outline</mat-icon>
      <p>{{ error }}</p>
      <button mat-raised-button color="primary" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        Retry
      </button>
    </div>

    <!-- Activity List -->
    <div *ngIf="!loading && !error" class="activity-list-container">
      <div *ngIf="activities.length === 0" class="empty-state">
        <mat-icon>inbox</mat-icon>
        <p>No recent activities</p>
      </div>

      <mat-list *ngIf="activities.length > 0" class="activity-list">
        <mat-list-item *ngFor="let activity of activities; let i = index" class="activity-item">
          <mat-icon matListItemIcon [class]="'action-icon ' + getActionColor(activity.action)">
            {{ getActionIcon(activity.action) }}
          </mat-icon>
          
          <div matListItemTitle class="activity-message">
            {{ activity.displayMessage }}
          </div>
          
          <div matListItemLine class="activity-meta">
            <span class="action-badge">{{ activity.action }}</span>
            <span class="timestamp">{{ activity.timeAgo }}</span>
          </div>
        </mat-list-item>
      </mat-list>
    </div>
  </mat-card-content>
</mat-card>
