# Name of the workflow as it appears in the GitHub Actions tab
name: Build and Push Email Worker

# Trigger: Run this workflow automatically every time code is pushed to the 'Azure_web_App_Deployment' branch
on:
  push:
    branches: [ "Azure_web_App_Deployment" ]

jobs:
  build-and-push:
    # Use the latest Ubuntu virtual machine hosted by GitHub to run the build steps
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code from your repository into the runner environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry (ghcr.io)
      # Uses the built-in GITHUB_TOKEN automatically provided by GitHub Actions
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build the Docker image and push it to ghcr.io
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # Context defines the build root folder (repository root)
          context: .
          # Relative path to your EmailWorker Dockerfile
          file: ./Utilities/EmailWorker/Dockerfile
          # Set push to true to publish the built image directly to GitHub Packages
          push: true
          # Tags the image with 'latest' under your GHCR package namespace
          tags: ghcr.io/${{ github.repository_owner }}/propertymaster-emailworker:latest