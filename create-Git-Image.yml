#This file is to create a git workflow to create image and upload to ghcr
name: Build and Push Email Worker

on:
  push:
    branches: [ "Azure_web_App_Deployment" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry (ghcr.io)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build the Docker image and push it to ghcr.io
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Utilities/EmailWorker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/propertymaster-emailworker:latest

      # =========================================================================
      # TODO: Automate Azure Container App deployment in the future.
      # Prerequisites to fully automate this step:
      # 1. Run `az ad sp create-for-rbac` in Azure CLI to get credentials.
      # 2. Add AZURE_CREDENTIALS under Repo Settings -> Secrets and variables -> Actions.
      # =========================================================================
      - name: Deploy EmailWorker to Azure Container Apps
        continue-on-error: true # <--- Prevents Azure login errors from marking the workflow run as failed
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: propertymaster-emailworker
          resourceGroup: PropertyMaster-RG
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/propertymaster-emailworker:latest